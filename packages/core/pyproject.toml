[project]
name = "vishap-core"
version = "0.1.0"
description = "Keys, limits, model settings and report shape shared by the Vishap services."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
full = ["pytest>=8", "ruff==0.17.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# src/ is the source root. Without this, import sorting depends on where ruff is started:
# from the repository root the tests sort their own package as third-party.
src = ["src"]
