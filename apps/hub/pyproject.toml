[project]
name = "vishap-hub"
version = "0.3.0"
description = "Carries a request between the client, the generator, the validator and the analyser."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
full = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
vishap-hub = "hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hub = ["web/*.html", "prompt/*.md", "web/*.mp3"]

[tool.ruff]
# src/ is the source root. Without this, import sorting depends on where ruff is started:
# from the repository root the tests sort their own package as third-party.
src = ["src"]
