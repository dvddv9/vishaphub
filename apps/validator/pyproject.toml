[project]
name = "vishap-validator"
version = "0.2.0"
description = "Validates generated code against the spec it was generated from: six stages, one verdict."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
full = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
vishap-validator = "validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
validator = ["web/*.html"]

[tool.ruff]
# src/ is the source root. Without this, import sorting depends on where ruff is started:
# from the repository root the tests sort their own package as third-party.
src = ["src"]
# examples/bad is deliberately broken code (syntax errors included): input for the validator tests.
extend-exclude = ["examples/bad"]
