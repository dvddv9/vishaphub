apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: production
spec:
  replicas: 3
  template:
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: app
        image: myapp:latest
        securityContext:
          privileged: true
          runAsUser: 0
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          capabilities:
            add: ["SYS_ADMIN", "NET_ADMIN", "SYS_PTRACE"]
        env:
        - name: DB_PASSWORD
          value: "admin123"
        - name: STRIPE_SECRET_KEY
          value: "sk_live_51H8xYzABC123def456"
        - name: JWT_SECRET
          value: "secret"
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        ports:
        - containerPort: 8080
          hostPort: 8080
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
