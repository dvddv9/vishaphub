# The one pre-commit config of the monorepo. pre-commit reads only the file at the root
# of the repository, so the configs that came in with each app (git subtree) never ran.
#
# Install once per clone:  pip install pre-commit && pre-commit install
# Run by hand:             pre-commit run --all-files
#
# ruff covers the whole monorepo except the analyzer.
# gitleaks is not a hook here: its first install downloads a Go toolchain (about 25 minutes
# on a slow link) and `gitleaks protect --staged` looks at staged changes only. The CI job
# `secrets` scans the whole tree instead.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        # analyzer ждёт отдельной задачи: часть замечаний в tests/bench/blind — это входные данные, а не код
        exclude: ^apps/analyzer/