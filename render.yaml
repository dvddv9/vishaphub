# VishapHub — one public door, three services behind it.
#
# The hub is what the world sees: the assistant with a voice, the page, the route.
# The analyser, the generator and the validator are called by the hub and do not need
# their own public entrance; their URLs live in the hub's environment.
services:
  - type: web
    name: vishap-hub
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    dockerContext: ./apps/hub
    dockerfilePath: ./apps/hub/Dockerfile
    envVars:
      - key: VISHAP_ANALYSER_URL
        value: https://vishap-zwpx.onrender.com
      - key: VISHAP_GENERATOR_URL
        value: https://vishap-generator.onrender.com
      - key: VISHAP_VALIDATOR_URL
        value: https://vishap-validator.onrender.com

# Kept as separate services today, reachable by URL, not advertised as doors:
#   analyzer  https://vishap-zwpx.onrender.com
#   generator https://vishap-generator.onrender.com
#   validator https://vishap-validator.onrender.com
