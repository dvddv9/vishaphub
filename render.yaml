# VishapHub — one public door, one process behind it.
#
# The hub, the validator's six stages and the analyser's rules run in one image: the
# pipeline calls them as libraries, so there is no second service to keep alive, no
# URL to misconfigure and no cold start between two halves of the same answer.
#
# The key: the model is the caller's. A client may send its own key; the owner's key,
# if any, is set in the Render panel and never lives in the repository.
services:
  - type: web
    name: vishap-hub
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    # The Dockerfile copies packages/core, apps/validator, apps/analyzer and apps/hub,
    # so the build context has to be the repository root, not ./apps/hub.
    dockerContext: .
    dockerfilePath: ./apps/hub/Dockerfile
    envVars:
      - key: VISHAP_HUB_LLM_KEY
        sync: false          # set in the panel; a client can also send api_key in the body
      # Behind Render's proxy every visitor reaches the app from the proxy's address. Without these two the per-address
      # limits are one shared bucket for everybody. Check what the app is sent with GET /api/team/diagnostics (an owner).
      - key: VISHAP_HUB_TRUST_HEADER
        value: x-forwarded-for
      - key: VISHAP_HUB_TRUSTED_HOPS
        value: "1"
      # Require an access key on the public spending endpoints. With no team database,
      # this shared secret authorizes access; it does not enable team accounts or durable run storage.
      - key: VISHAP_HUB_REQUIRE_KEY
        value: "1"
      - key: VISHAP_HUB_ACCESS_KEY
        sync: false

# The separate services (analyzer, generator, validator) are deliberately absent: the
# hub does not call them over the network any more. Their repositories still build and
# deploy on their own.
