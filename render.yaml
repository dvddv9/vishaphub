# VishapHub — four services, one file that says what runs where.
services:
  - type: web
    name: vishap-hub
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    dockerContext: ./apps/hub
    dockerfilePath: ./apps/hub/Dockerfile
    envVars:
      - key: VISHAP_ANALYSER_URL
        value: https://vishap-zwpx.onrender.com
      - key: VISHAP_GENERATOR_URL
        value: https://vishap-generator.onrender.com

  - type: web
    name: vishap-validator
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    dockerContext: ./apps/validator
    dockerfilePath: ./apps/validator/Dockerfile

  - type: web
    name: vishap-analyzer
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    dockerContext: ./apps/analyzer
    dockerfilePath: ./apps/analyzer/Dockerfile

  - type: web
    name: vishap-generator
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    dockerContext: ./apps/generator
    dockerfilePath: ./apps/generator/Dockerfile
