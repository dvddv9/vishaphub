<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishap Generator</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111827; --mut:#6b7280; --line:#e5e7eb; --card:#f9fafb; --ok:#166534; --bad:#b91c1c; --warn:#92400e; --acc:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e5e7eb; --mut:#94a3b8; --line:#1e293b; --card:#0f172a; --ok:#86efac; --bad:#fca5a5; --warn:#fcd34d; --acc:#93c5fd; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 28px 0 8px; }
  p.lead { color: var(--mut); margin: 0 0 20px; }
  textarea { width:100%; height: 340px; font: 13.5px/1.6 ui-monospace,Menlo,Consolas,monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:12px; resize: vertical; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:12px 0; }
  label { display:flex; gap:6px; align-items:center; }
  input[type=number] { width: 64px; padding:4px 6px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  input[type=password] { padding:6px 8px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:wait; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px 8px 0; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid currentColor; }
  .passed { color:var(--ok); } .failed { color:var(--bad); } .needs_verification, .not_verified { color:var(--warn); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; font:13px/1.55 ui-monospace,Menlo,Consolas,monospace; margin:6px 0 14px; }
  .mut { color:var(--mut); } .err { color:var(--bad); font-weight:600; }
  details { margin: 6px 0; } summary { cursor:pointer; font-family: ui-monospace,Menlo,Consolas,monospace; font-size:14px; }
  ul { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>Vishap Generator</h1>
  <p class="lead">A specification in, code out, and every requirement proven or marked not proven. This page runs the five stages; it never writes to the server's disk, the files come back here.</p>

  <label for="spec"><strong>spec.yaml</strong></label>
  <textarea id="spec" spellcheck="false">version: 1
updated: 2026-10-28

text: |
  Add an HTTP endpoint GET /user that returns one user by name
  from the app database. Called by the public web app, without sign-in.

target: python/flask
kind: http-endpoint
output: handlers/user.py
caller: public
route: GET /user

inputs:
  - name: name
    in: query
    rule: "1-64 letters and digits"

outputs:
  - status: 200
    body: "json: id, name only"
  - status: 404
    when: "no such user"
  - status: 400
    when: "invalid name"

profile: owasp-asvs-2
constraints: [include-tests, validate-inputs]

must_never:
  - id: sql-from-input
    text: "SQL is never built from the input"
  - id: log-raw-input
    text: "Raw input is never logged"

check: analyzer
</textarea>

  <div class="row">
    <label><input type="checkbox" id="gate"> gate</label>
    <label>repair rounds <input type="number" id="repairs" min="0" max="5" value="2"></label>
    <label><input type="checkbox" id="noanalyzer"> skip Analyzer</label>
    <label>token <input type="password" id="token" placeholder="only if the server needs one" autocomplete="off"></label>
  </div>
  <div class="row">
    <button id="check">Check the spec (no model)</button>
    <button id="run" class="primary">Generate and verify</button>
    <span id="status" class="mut"></span>
  </div>

  <div id="out"></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const out = $("out");
// the example spec says it was reviewed today, so it is not stale on first run
$("spec").value = $("spec").value.replace(/^updated: .*$/m, "updated: " + new Date().toISOString().slice(0, 10));

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else e.setAttribute(k, v); }
  for (const k of kids) e.append(k);
  return e;
}
const pill = (s) => el("span", { class: "pill " + s }, s.replace("_", " "));

function render(r) {
  out.replaceChildren();
  if (r.error) { out.append(el("p", { class: "err" }, "Error: " + r.error)); }
  if (r.verify) {
    out.append(el("h2", null, "Verdict: ", pill(r.verify.code_verdict)));
    const meta = [];
    meta.push("coverage " + (r.verify.coverage.percent == null ? r.verify.coverage.status : Math.round(r.verify.coverage.percent) + "%"));
    meta.push(r.verify.spec.stale ? "spec stale (" + r.verify.spec.age_days + " days)" : "spec fresh");
    meta.push("repair rounds used: " + r.repair_rounds);
    if (r.verify.analyzer) meta.push("analyzer " + r.verify.analyzer.status);
    out.append(el("p", { class: "mut" }, meta.join(" · ")));
    if (r.deliver && r.deliver.gate.blocked) {
      const ul = el("ul");
      for (const x of r.deliver.gate.reasons) ul.append(el("li", null, x));
      out.append(el("p", null, r.deliver.blocked ? "The gate would block the write:" : "Gate reasons:"), ul);
    }
  }
  if (r.requirements && r.requirements.length) {
    out.append(el("h2", null, "Requirements"));
    const verdicts = {};
    if (r.verify) for (const v of r.verify.requirements) verdicts[v.id] = v;
    const t = el("table");
    t.append(el("tr", null, ...["ID", "Requirement", "Priority", "Status", "Evidence"].map((h) => el("th", null, h))));
    for (const q of r.requirements) {
      const v = verdicts[q.id];
      const ev = el("td");
      if (v) for (const e of v.evidence) ev.append(el("div", { class: e.status === "pass" ? "mut" : "failed" }, e.source + " " + e.name + ": " + e.status + (e.detail ? " (" + e.detail + ")" : "")));
      if (v && v.note) ev.append(el("div", { class: "mut" }, v.note));
      t.append(el("tr", null, el("td", null, q.id), el("td", null, q.text), el("td", null, q.priority), el("td", null, v ? pill(v.status) : "-"), ev));
    }
    out.append(t);
  }
  if (r.design && r.design.gaps.length) {
    out.append(el("h2", null, "Gaps"));
    const ul = el("ul");
    for (const g of r.design.gaps) ul.append(el("li", null, g.id + " [" + g.severity + "] " + g.text));
    out.append(ul);
  }
  if (r.verify && (r.verify.problems.length || r.verify.notes.length)) {
    out.append(el("h2", null, "Problems and notes"));
    const ul = el("ul");
    for (const p of r.verify.problems) ul.append(el("li", { class: "failed" }, p));
    for (const p of r.verify.notes) ul.append(el("li", { class: "mut" }, p));
    out.append(ul);
  }
  if (r.files) {
    out.append(el("h2", null, "Files"));
    for (const [p, c] of Object.entries(r.files)) out.append(el("details", null, el("summary", null, p), el("pre", null, c)));
  }
  if (r.trace) out.append(el("details", null, el("summary", null, "trace.json"), el("pre", null, JSON.stringify(r.trace, null, 2))));
  if (r.log && r.log.length) out.append(el("details", null, el("summary", null, "run log"), el("pre", null, r.log.join("\n"))));
}

async function call(path) {
  const buttons = [$("check"), $("run")];
  buttons.forEach((b) => (b.disabled = true));
  $("status").textContent = "working... a model run can take a few minutes";
  try {
    const headers = { "Content-Type": "application/json" };
    if ($("token").value) headers["Authorization"] = "Bearer " + $("token").value;
    const res = await fetch(path, {
      method: "POST", headers,
      body: JSON.stringify({ spec: $("spec").value, gate: $("gate").checked, repairs: Number($("repairs").value), no_analyzer: $("noanalyzer").checked }),
    });
    const data = await res.json();
    if (!res.ok) render({ error: data.error || res.statusText }); else render(data);
    $("status").textContent = "";
  } catch (e) {
    render({ error: String(e) });
    $("status").textContent = "";
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}
$("check").addEventListener("click", () => call("/api/check"));
$("run").addEventListener("click", () => call("/api/generate"));
</script>
</body>
</html>
