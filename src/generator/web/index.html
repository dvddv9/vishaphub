<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishap Generator</title>
<style>
/* Same palette and shapes as the Vishap web app: slate surfaces, sky buttons, emerald accent in the hero. */
:root {
  --background:#f8fafc; --foreground:#0f172a; --surface:#ffffff; --border:#e2e8f0;
  --s100:#f1f5f9; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b;
  --sky:#0ea5e9; --sky-h:#38bdf8; --ok:#15803d; --bad:#b91c1c; --warn:#a16207; --run:#1d4ed8;
  --ok-bg:rgba(34,197,94,.12); --bad-bg:rgba(239,68,68,.12); --warn-bg:rgba(234,179,8,.12); --neutral-bg:rgba(100,116,139,.12);
  --add:rgba(34,197,94,.14); --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme: light;
}
html[data-theme="dark"] {
  --background:#020617; --foreground:#f8fafc; --surface:#0f172a; --border:#334155;
  --s100:#1e293b; --s300:#475569; --s400:#64748b; --s500:#94a3b8; --s600:#cbd5e1; --s700:#e2e8f0; --s800:#f1f5f9;
  --ok:#4ade80; --bad:#fca5a5; --warn:#fcd34d; --run:#93c5fd; color-scheme: dark;
}
* { box-sizing:border-box; }
html { height:100%; }
body { margin:0; background:var(--background); color:var(--foreground); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
a { color:inherit; }
:focus-visible { outline:2px solid var(--sky); outline-offset:2px; }
.wrap { max-width:72rem; margin:0 auto; padding:0 1rem; }
.mono { font-family:var(--mono); }
.muted { color:var(--s500); }
h1,h2,h3,h4 { margin:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* navbar */
header.nav { position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter:blur(8px); }
header.nav nav { display:flex; align-items:center; gap:.25rem; height:3.5rem; max-width:72rem; margin:0 auto; padding:0 1rem; }
.brand { margin-right:.75rem; display:flex; gap:.5rem; align-items:center; font-weight:600; letter-spacing:-.01em; text-decoration:none; }
.navlink { min-height:2.25rem; display:flex; align-items:center; padding:.375rem .625rem; border-radius:.375rem; font-size:.875rem; color:var(--s600); text-decoration:none; }
.navlink:hover, .navlink[aria-current="page"] { background:var(--s100); color:var(--foreground); }
.spacer { margin-left:auto; display:flex; gap:.5rem; align-items:center; }
.brand { white-space:nowrap; }
@media (max-width:30rem) { .brand .long, .chip { display:none; } header.nav nav { padding:0 .75rem; } }
.chip { border:1px solid var(--border); border-radius:.375rem; padding:.25rem .5rem; font-size:.7rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:var(--s500); }
button, .btn { font:inherit; }
.iconbtn { min-height:2.25rem; min-width:2.25rem; border:1px solid var(--border); background:var(--surface); color:var(--s600); border-radius:.375rem; cursor:pointer; }
.iconbtn:hover { background:var(--s100); }

/* buttons */
.btn { display:inline-flex; align-items:center; gap:.5rem; min-height:2.5rem; padding:.5rem 1rem; border-radius:.5rem; font-size:.875rem; cursor:pointer; text-decoration:none; border:1px solid var(--s300); background:var(--surface); color:var(--s700); box-shadow:0 1px 2px rgba(0,0,0,.04); }
.btn:hover { background:var(--s100); }
.btn.primary { background:var(--sky); border-color:var(--sky); color:#020617; font-weight:600; box-shadow:none; }
.btn.primary:hover { background:var(--sky-h); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.danger:hover { border-color:#fca5a5; background:var(--bad-bg); color:var(--bad); }

/* hero (always dark, like Vishap) */
.hero { position:relative; overflow:hidden; background:#020617; color:#f1f5f9; border-bottom:1px solid #1e293b; }
.hero .grid { position:absolute; inset:0; background-image:linear-gradient(to right, rgb(148 163 184 / .35) 1px, transparent 1px), linear-gradient(to bottom, rgb(148 163 184 / .35) 1px, transparent 1px); background-size:56px 56px; opacity:.18; -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 40%, transparent 100%); mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 40%, transparent 100%); }
.hero .glow { position:absolute; top:-8rem; left:50%; width:45rem; max-width:100%; height:26rem; transform:translateX(-50%); border-radius:50%; background:rgba(16,185,129,.2); filter:blur(120px); }
.hero .in { position:relative; display:grid; gap:2.5rem; padding:3.5rem 1.25rem; max-width:72rem; margin:0 auto; }
@media (min-width:64rem) { .hero .in { grid-template-columns:1.05fr .95fr; align-items:center; padding:6rem 1.25rem; gap:3rem; } }
.pill { display:inline-flex; align-items:center; gap:.5rem; border:1px solid rgba(52,211,153,.3); background:rgba(52,211,153,.1); color:#6ee7b7; border-radius:999px; padding:.25rem .75rem; font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
.dot { width:6px; height:6px; border-radius:50%; background:#34d399; animation:pulse 2s infinite; }
@keyframes pulse { 50% { opacity:.35; } }
.hero h1 { margin-top:1.5rem; font-size:clamp(2.4rem,6vw,3.75rem); line-height:1.05; letter-spacing:-.02em; font-weight:600; }
.hero h1 em { font-style:normal; color:#34d399; }
.hero p.lead { margin:1.25rem 0 0; max-width:36rem; color:#cbd5e1; line-height:1.65; }
.hero p.meta { margin:.75rem 0 0; font:12px var(--mono); color:#94a3b8; }
.hero .cta { margin-top:2rem; display:flex; flex-wrap:wrap; gap:.75rem; }
.hero .btn.em { background:#34d399; border-color:#34d399; color:#020617; font-weight:600; padding:.75rem 1.5rem; box-shadow:none; }
.hero .btn.em:hover { background:#6ee7b7; }
.hero .btn.ghost { background:transparent; border-color:#475569; color:#f1f5f9; padding:.75rem 1.5rem; box-shadow:none; }
.hero .btn.ghost:hover { border-color:#94a3b8; }
.sample { border:1px solid #334155; border-radius:.75rem; background:#0f172a; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.4); }
.sample .bar { display:flex; align-items:center; gap:.5rem; padding:.625rem .875rem; border-bottom:1px solid #1e293b; background:#0b1220; font:11px var(--mono); color:#cbd5e1; }
.sample .bar i { width:10px; height:10px; border-radius:50%; background:#334155; display:inline-block; }
.sample .bar .r { margin-left:auto; font-size:10px; color:#94a3b8; }
.sample .body { padding:1rem; display:grid; gap:.9rem; }
.sample .lab { font:10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#94a3b8; margin-bottom:.35rem; }
.sample .row { display:flex; gap:.5rem; align-items:center; font-size:13px; color:#e2e8f0; padding:.2rem 0; }
.sample .row .st { margin-left:auto; font:11px var(--mono); }
.sample .okc { color:#4ade80; } .sample .badc { color:#fda4af; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin:0; }
.stats div { border:1px solid #1e293b; border-radius:.5rem; padding:.6rem .75rem; background:#0b1220; }
.stats dt { font:10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#94a3b8; }
.stats dd { margin:.15rem 0 0; font-weight:600; color:#f1f5f9; }

/* page blocks */
main.wrap { padding-top:2.5rem; padding-bottom:4rem; }
.card { border:1px solid var(--border); background:var(--surface); border-radius:.75rem; padding:1rem 1.25rem; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.grid3 { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); margin-top:1.5rem; }
.card h3 { font-size:1rem; font-weight:600; }
.card p { margin:.4rem 0 0; font-size:.875rem; color:var(--s600); }
.sec { margin-top:2.5rem; }
.sec > h2 { font-size:1.125rem; font-weight:500; }
.steps { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); margin-top:.75rem; }
.step .n { font:11px var(--mono); color:var(--s500); }
.actions { margin-top:2rem; display:flex; flex-wrap:wrap; gap:.75rem; }
.status { margin-top:1rem; min-height:1.5rem; font-size:.8rem; color:var(--s500); display:flex; flex-wrap:wrap; gap:.4rem 1rem; }
.status b { color:var(--s700); font-weight:600; }
details.faq { border:1px solid var(--border); background:var(--surface); border-radius:.75rem; padding:.75rem 1rem; margin-top:.5rem; }
details summary { cursor:pointer; min-height:2.25rem; display:flex; align-items:center; font-size:.875rem; font-weight:500; }
details p { margin:.25rem 0 .5rem; font-size:.875rem; color:var(--s600); }

/* run cards */
.jobs { margin-top:1rem; display:grid; gap:.75rem; }
.job { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; text-decoration:none; }
.job:hover { border-color:var(--s400); }
.job .name { font:.875rem var(--mono); }
.job .sub { font-size:.75rem; color:var(--s500); font-family:var(--mono); }
.job .grow { flex:1; min-width:10rem; }
.empty { border:1px dashed var(--s300); border-radius:.75rem; padding:2rem; text-align:center; color:var(--s500); font-size:.875rem; }

/* badges */
.badge { display:inline-flex; align-items:center; gap:.375rem; border-radius:999px; border:1px solid transparent; font-size:.75rem; font-weight:500; line-height:1; padding:.25rem .625rem; white-space:nowrap; }
.badge-passed, .badge-pass, .badge-done { background:var(--ok-bg); border-color:rgba(34,197,94,.35); color:var(--ok); }
.badge-failed, .badge-fail, .badge-error, .badge-critical { background:var(--bad-bg); border-color:rgba(239,68,68,.35); color:var(--bad); }
.badge-needs_verification, .badge-not_verified, .badge-high, .badge-warning { background:var(--warn-bg); border-color:rgba(234,179,8,.35); color:var(--warn); }
.badge-neutral, .badge-medium, .badge-note, .badge-skipped { background:var(--neutral-bg); border-color:rgba(100,116,139,.35); color:var(--s700); }

/* forms */
.form { display:grid; gap:1.5rem; }
@media (min-width:60rem) { .form.two { grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); align-items:start; } }
fieldset { border:0; padding:0; margin:0; min-width:0; }
legend, label.l { font-size:.875rem; font-weight:500; color:var(--s700); }
textarea, input[type=text], input[type=password], input[type=number], select { width:100%; background:var(--surface); color:var(--foreground); border:1px solid var(--s300); border-radius:.5rem; padding:.5rem .75rem; font:inherit; }
textarea { font:13.5px/1.6 var(--mono); min-height:26rem; resize:vertical; max-width:100%; }
.fieldgrid { display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr)); }
.field { min-width:0; }
.field { display:grid; gap:.3rem; }
.chk { display:flex; gap:.75rem; align-items:flex-start; border:1px solid var(--border); border-radius:.5rem; padding:.6rem .8rem; font-size:.875rem; }
.chk b { display:block; font-weight:500; color:var(--s700); }
.chk span.d { color:var(--s500); font-size:.8rem; }
.chk input { margin-top:.2rem; }
.pillrow { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.5rem; }
.pillbtn { border:1px solid var(--s300); background:var(--surface); color:var(--s700); border-radius:999px; padding:.35rem .9rem; font-size:.8rem; cursor:pointer; }
.pillbtn:hover { border-color:var(--s500); }
.err { border:1px solid rgba(239,68,68,.35); background:var(--bad-bg); color:var(--bad); border-radius:.75rem; padding:.75rem 1rem; font-size:.875rem; }
.note { border:1px solid var(--border); background:var(--s100); color:var(--s600); border-radius:.75rem; padding:.75rem 1rem; font-size:.8rem; }
.good li { margin:.3rem 0; }
ul.tight { margin:.4rem 0; padding-left:1.1rem; font-size:.875rem; color:var(--s600); }

/* progress */
.progress { display:flex; align-items:center; gap:.75rem; }
.steps { list-style:none; display:flex; flex-wrap:wrap; gap:.4rem; margin:.75rem 0 0; padding:0; }
.step { border:1px solid var(--s300); border-radius:999px; padding:.2rem .7rem; font-size:.78rem; color:var(--s500); }
.step.done { border-color:var(--ok); color:var(--ok); }
.step.now { border-color:var(--sky); color:var(--foreground); font-weight:600; }
.livelog { margin:.6rem 0 0; max-height:14rem; overflow:auto; font:12px/1.5 var(--mono); white-space:pre-wrap; word-break:break-word; background:var(--surface); border:1px solid var(--border); border-radius:.5rem; padding:.6rem .8rem; }
.livelog:empty { display:none; }
.spin { width:1rem; height:1rem; border:2px solid var(--s300); border-top-color:var(--sky); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* result */
.head { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }
.head h1 { font:1.1rem var(--mono); word-break:break-all; }
.tabs { margin-top:1.5rem; display:flex; gap:.25rem; border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { border:0; background:none; color:var(--s600); padding:.6rem .9rem; font-size:.875rem; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; min-height:2.5rem; }
.tab[aria-selected="true"] { color:var(--foreground); border-bottom-color:var(--sky); font-weight:600; }
.panel { margin-top:1.25rem; }
.kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.75rem; margin:1rem 0; }
.kv div { border:1px solid var(--border); border-radius:.6rem; padding:.6rem .8rem; background:var(--surface); }
.kv dt { font:10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--s500); }
.kv dd { margin:.2rem 0 0; font-weight:600; font-size:.95rem; }
table { width:100%; border-collapse:collapse; font-size:.875rem; text-align:left; }
th { padding:.5rem .75rem .5rem 0; font-weight:500; color:var(--s500); font-size:.8rem; }
td { padding:.6rem .75rem .6rem 0; border-top:1px solid var(--border); vertical-align:top; }
.scroll { overflow-x:auto; }
.ev { font:12px/1.5 var(--mono); }
.ev.bad { color:var(--bad); } .ev.good { color:var(--s500); }
.terminal { background:var(--surface); border:1px solid var(--border); border-radius:.75rem; font:.8125rem/1.6 var(--mono); overflow-x:auto; padding:.875rem 1rem; white-space:pre-wrap; word-break:break-word; margin:.5rem 0 1rem; }
.diff .a { background:var(--add); display:block; } .diff .h { color:var(--run); display:block; } .diff .d { color:var(--bad); display:block; }
.filehead { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
.filehead .grow { flex:1; }
.mini { min-height:1.9rem; padding:.2rem .7rem; font-size:.75rem; }
.reasons li { margin:.2rem 0; }
</style>
</head>
<body>
<header class="nav"><nav aria-label="Main" id="nav"></nav></header>
<div id="app"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const badge = (kind, text) => el("span", { class: "badge badge-" + kind }, text || String(kind).replace(/_/g, " "));
function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }
const store = {
  get: (k, d) => safe(() => JSON.parse(localStorage.getItem(k)) ?? d, d),
  set: (k, v) => safe(() => localStorage.setItem(k, JSON.stringify(v))),
};
const session = {
  get: (k, d) => safe(() => JSON.parse(sessionStorage.getItem(k)) ?? d, d),
  set: (k, v) => safe(() => sessionStorage.setItem(k, JSON.stringify(v))),
  del: (k) => safe(() => sessionStorage.removeItem(k)),
};
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago"; return Math.floor(s / 86400) + " d ago";
};
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
  const a = el("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1200); }
  catch (e) { btn.textContent = "Select and copy by hand"; }
}

/* ---------- state ---------- */
const app = { status: null, examples: [], draft: null };
const llm = () => session.get("vg:llm", { provider: "server", model: "", key: "", thinking: "" });
const token = () => session.get("vg:token", "");

async function api(path, body) {
  const headers = {};
  let opts = {};
  if (body !== undefined) { headers["Content-Type"] = "application/json"; opts = { method: "POST", body: JSON.stringify(body) }; }
  if (token()) headers["Authorization"] = "Bearer " + token();
  const res = await fetch(path, { ...opts, headers });
  let data = {};
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  return { ok: res.ok, status: res.status, data };
}

/* A generate run as a job: start it, poll for the stage and the new log lines, resolve with the same
   {ok, status, data} shape as api(). A server without /api/generate/async (404) falls back to the one-call answer. */
const STAGE_NAMES = ["Intake", "Design", "Build", "Verify", "Deliver"];
async function runJob(body, onUpdate) {
  const start = await api("/api/generate/async", body);
  if (start.status === 404) return api("/api/generate", body);
  if (start.status !== 202) return start;
  const id = start.data.job;
  let since = 0, failures = 0;
  for (;;) {
    await new Promise((r) => setTimeout(r, 1000));
    let r;
    try { r = await api("/api/jobs/" + encodeURIComponent(id) + "?since=" + since); failures = 0; }
    catch (e) { if (++failures >= 5) return { ok: false, status: 0, data: { error: "lost the server while the run was going: " + e } }; continue; }
    if (!r.ok) return r;
    const j = r.data;
    since = j.log_total;
    onUpdate(j);
    if (j.status === "done" || j.status === "failed") {
      const st = j.http_status || (j.status === "done" ? 200 : 500);
      return { ok: st < 400, status: st, data: j.result || { error: j.error || "the run failed" } };
    }
  }
}

/* ---------- theme + navbar ---------- */
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
applyTheme(store.get("vg:theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

function renderNav() {
  const here = location.hash.replace(/^#/, "") || "/";
  const link = (href, label) => el("a", { class: "navlink", href: "#" + href, "aria-current": (href === "/" ? here === "/" : here.startsWith(href)) ? "page" : false }, label);
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $("#nav").replaceChildren(
    el("a", { class: "brand", href: "#/" }, el("span", { "aria-hidden": "true" }, "🐉"), el("span", null, "Vishap", el("span", { class: "long" }, " Generator"))),
    link("/", "Dashboard"), link("/generate", "Generate"),
    el("div", { class: "spacer" },
      el("button", { class: "iconbtn", "aria-label": dark ? "Switch to light theme" : "Switch to dark theme", onclick: () => {
        const t = dark ? "light" : "dark"; applyTheme(t); store.set("vg:theme", t); renderNav(); }}, dark ? "☀" : "☾"),
      el("span", { class: "chip" }, app.status && app.status.token_required ? "Token" : "Local")));
}

/* ---------- dashboard ---------- */
const FEATURES = [
  ["Requirements, numbered", "Every input, output and must-never line of the spec becomes R1..Rn with a priority. Nothing is invented from the free text."],
  ["Attacks of its own", "Verify does not trust the model's tests: it sends boundary values, a trailing newline, quotes and over-long input to the code itself."],
  ["Rules on the syntax tree", "SQL built from input and raw input in logs are found by reading the code, not by hoping a test covers them."],
  ["Analyzer check", "The generated code goes through the Vishap Analyzer when it is installed; its errors fail the code, and are sent back to the model to fix."],
  ["A gate you can use in CI", "Failed or unproven critical and high requirements, low coverage, an open critical gap or a stale spec block the write."],
  ["Trace and rollback", "Each requirement is traced to code, tests and evidence. Every write keeps a backup, and one command puts the old files back."],
];
const STAGES = [
  ["Intake", "The spec file becomes numbered requirements with priorities. No model."],
  ["Design", "Plans the files and reports gaps in the spec. The model compares the free text with the requirements."],
  ["Build", "The model writes code and a test per requirement. Syntax and lint are checked at once."],
  ["Verify", "Model tests, own attacks, static rules, coverage, spec age and the Analyzer. Problems go back to the model."],
  ["Deliver", "Gate, diff, backup, write, trace.json, rollback."],
];
const FAQ = [
  ["What does it produce?", "Code and tests for the files the spec asks for, a verdict per requirement, and a trace that links each requirement to code, tests and evidence."],
  ["Does this page write files?", "No. The page never writes to the server's disk: files come back here and you download them. The command line writes into a folder you name, with backup and rollback."],
  ["Is the generated code safe to run?", "Verify runs it in a subprocess with a clean environment and a timeout, but that is not isolation: it runs with your rights. Read the code before you use it, and use Docker for specs you do not trust."],
  ["What is a gap?", "Something the spec leaves out or contradicts, for example no answer for invalid input. Critical gaps block a gated write; notes do not."],

/* ---------- runs ---------- */
function saveRun(data, specText, mode) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const summary = mode === "check"
    ? (data.requirements || []).length + " requirements, " + ((data.design && data.design.gaps) || []).length + " gaps"
    : v ? v.requirements.filter((r) => r.status === "passed").length + "/" + v.requirements.length + " passed" : (data.error || "no result");
  const run = { id, time: new Date().toISOString(), name, mode, verdict: v ? v.code_verdict : (data.error ? "failed" : "neutral"), summary, spec: specText, result: data };
  let runs = [run, ...store.get("vg:runs", [])].slice(0, 12);
  while (runs.length > 1 && JSON.stringify(runs).length > 3_500_000) runs.pop();
  store.set("vg:runs", runs);
  return run;
}

/* ---------- router ---------- */
async function render() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = hash.split("?");
  const query = new URLSearchParams(qs || "");
  renderNav();
  let page;
  if (path === "/generate") { page = pageGenerate(query); }
  else if (path.startsWith("/run/")) { page = pageRun(path.slice(5)); }
  else { page = pageDashboard(); }
  $("#app").replaceChildren(page);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

(async function boot() {
  $("#app").replaceChildren(el("main", { class: "wrap" }, el("p", { class: "muted" }, "Loading…")));
  try {
    const [s, e] = await Promise.all([api("/api/status"), api("/api/examples")]);
    if (s.ok) app.status = s.data;
    if (e.ok) app.examples = e.data.examples || [];
  } catch (err) { /* the page still works without them */ }
  render();
})();
