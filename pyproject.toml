[project]
name = "vishap-generator"
version = "0.0.1"
description = "Spec-to-code generator that proves its output"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
full = ["coverage>=7", "ruff"]

[project.scripts]
vishap-generator = "generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generator = ["web/*.html"]
