[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vishap-analyzer"
version = "7.4.2"
description = "Vishap - multi-material IT analyst (code, config, spec, logs, data). 6-stage LLM pipeline with SAST/SCA, SARIF 2.1.0, OWASP Top 10, audit trail (SHA-256), provenance, exploitability."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "David (dvddv9)", email = "hndav9@yahoo.com"}]
keywords = ["vishap", "vishap-analyzer", "security", "sast", "sca", "sarif", "owasp", "llm", "multi-material", "code-review", "audit-trail", "compliance", "pii", "deepseek"]

# v6.1-fix: block1+block2 deps
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "radon>=6.0.0",
    "tenacity>=9.2.0",
    "httpx>=0.27.0",
    "cyclonedx-bom>=7.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "zstandard>=0.22.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "PyJWT>=2.9.0",
    "stripe>=10.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "black>=24.0.0"]

[project.scripts]
vishap = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "vishap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
# Every async test gets its own event loop, and async fixtures never leak a
# loop from one test into the next. Without this, a loop-bound resource (an
# asyncpg engine inside PostgresJobStore, for example) that is cached at
# module scope outlives the loop it was created on and the next test dies with
# "another operation is in progress".
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
ignore = [
    "F821",  # undefined name: false positive (dir() guard in orchestrator)
    "F841",  # local variable assigned but never used (debug: original_audit_compliance)
]

[tool.setuptools.package-data]
vishap = ["*.md"]

