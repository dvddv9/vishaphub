[project]
name = "vishap-validator"
version = "0.1.0"
description = "Validates generated code against the spec it was generated from: structure, syntax, contract, behaviour."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
full = ["pytest>=8", "ruff"]

[project.scripts]
vishap-validator = "validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
