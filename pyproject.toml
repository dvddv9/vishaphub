[project]
name = "vishap-generator"
version = "0.7.0"
description = "Spec-to-code generator that proves its output"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
full = ["coverage>=7", "ruff"]

[project.scripts]
vishap-generator = "generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generator = ["web/*.html", "prompts/*.md"]
